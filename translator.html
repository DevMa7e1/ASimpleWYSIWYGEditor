<!DOCTYPE html>
<html>
    <head>
        <title>default-title</title>
        <script>
            function loaded(){
                const parent = document.querySelector('#parentofelements')
                parent.addEventListener('click', (ev) => document.getElementsByTagName('title')[0].innerHTML = ev.target.id)
            }
        </script>
        <style>
            /*stylearea*/
        </style>
    </head>
    <body onload="loaded()">
        <div id="parentofelements">
            <!--addarea%-->
        </div>
    </body>
</html>
